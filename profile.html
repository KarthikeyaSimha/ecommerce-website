<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ShopEase</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">My Profile</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="page-title">
    <h1>My Profile</h1>
    <p>View your account information</p>
</div>

<div class="form-container">

    <div style="text-align:center; font-size:70px;">
        👤
    </div>

    <h2 id="profileName">User</h2>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" readonly>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" readonly>
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" readonly>
    </div>

    <button onclick="logout()" class="btn form-button">
        Logout
    </button>

</div>

<footer>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script>

    const user = JSON.parse(localStorage.getItem("shopEaseUser"));

    if (!user) {
        alert("Please login first.");
        window.location.href = "login.html";
    } else {

        document.getElementById("profileName").textContent = user.name;
        document.getElementById("name").value = user.name;
        document.getElementById("email").value = user.email;
        document.getElementById("phone").value = user.phone;

    }

    function logout() {
        localStorage.removeItem("shopEaseLoggedIn");
        window.location.href = "login.html";
    }

</script>

</body>
</html>
